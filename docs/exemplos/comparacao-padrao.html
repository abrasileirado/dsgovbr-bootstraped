<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Comparação: Bootstrap padrão</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../vendor/bootstrap/dist/css/bootstrap.min.css">
  <style>body { padding: 1.5rem; }</style>
</head>
<body>
  <h6 class="text-muted mb-3">Bootstrap padrão (sem dsgovbr-bootstraped)</h6>
  <button type="button" class="btn btn-primary me-1">Primary</button>
  <button type="button" class="btn btn-outline-primary mb-3">Outline</button>
  <div class="mb-2">
    <label for="nome" class="form-label">Nome completo</label>
    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="c1" checked>
    <label class="form-check-label" for="c1">Lembrar de mim</label>
  </div>
</body>
</html>
