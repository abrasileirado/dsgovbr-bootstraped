name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "20 19 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      security-events: write # github/codeql-action/upload-sarif
      actions: read # só exigido em repositório privado pelo upload-sarif
    # Imagem oficial (a returntocorp/semgrep-action está deprecada). Sem
    # SEMGREP_APP_TOKEN: usa regras públicas (--config auto) e não depende de
    # conta no semgrep.dev. Achados são informativos (sem --error): não
    # bloqueiam o push; vão para a aba Security (code scanning).
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan
        # vendor/ (submodules) e artefatos gerados não são código nosso.
        run: >-
          semgrep scan --config auto
          --exclude vendor --exclude node_modules --exclude dist --exclude docs/assets
          --sarif-output=semgrep.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
