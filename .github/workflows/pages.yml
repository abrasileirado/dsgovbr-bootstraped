name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar CSS (dist/ e docs/assets/)
        run: npm run build

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar Sphinx e o tema dsgovbr-sphinx-theme
        run: python -m pip install -r docs/requirements.txt

      - name: Build com Sphinx
        # Gera as páginas reST e copia docs/assets, docs/componentes e
        # docs/exemplos (HTML estático) para a saída (ver docs/conf.py).
        run: sphinx-build -W --keep-going -b html docs ./_site

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
