name: Release

# Dispare com: git tag vX.Y.Z && git push origin vX.Y.Z
# Não rode `gh release create` antes — a release é criada aqui, já com os
# assets (evita "Cannot upload asset to an immutable release").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # para criar a Release e anexar artefatos
  id-token: write # para publicação confiável (OIDC) no npm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Atualizar npm (necessário para trusted publishing via OIDC)
        # npm 11.5+ suporta trusted publishing via OIDC. Fixamos a major 11
        # em vez de "latest" para não mudar de major sem revisão.
        run: npm install -g npm@11

      - name: Conferir que a tag bate com a versão do package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME diferente de package.json ($PKG)" >&2
            exit 1
          fi

      - name: Compilar
        run: npm run build

      - name: Validar o conteúdo do pacote (dry run)
        run: npm pack --dry-run

      - name: Testar o pacote num consumidor limpo (CSS e SCSS)
        run: npm test

      - name: Publicar no npm
        # Requer "Trusted Publisher" configurado uma única vez pelo mantenedor
        # em https://www.npmjs.com/package/@abrasileirado/dsgovbr-bootstraped
        # → Settings → Trusted Publishers, apontando para este repositório e
        # este workflow, com "Allow npm publish" habilitado (DP-07 em
        # docs/requisitos.md). Sem isso, esta etapa falha (fail-fast) —
        # nenhuma Release é criada antes de um publish bem-sucedido no npm.
        run: npm publish --access public

      - name: Criar a Release (rascunho com assets) e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/dsgovbr-bootstraped.css \
            dist/dsgovbr-bootstraped.min.css \
            dist/dsgovbr-bootstraped.css.map
          gh release edit "$GITHUB_REF_NAME" --draft=false
