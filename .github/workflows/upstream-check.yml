name: Verificar atualizações upstream

# O Dependabot não cobre submodules por tag (ver .github/dependabot.yml e
# DP-09 em docs/requisitos.md). Este workflow avisa, por issue, quando há tag
# estável nova de Bootstrap ou GOV.BR DS — a atualização em si é manual.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Sem submodules: o script lê o commit fixado via `git ls-tree` e as
      # tags remotas via `git ls-remote`.
      - uses: actions/checkout@v7

      - name: Comparar tags fixadas com as últimas upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.js --open-issues

      # A documentação carrega a fonte Rawline deste CDN (issue #34): se ele
      # sair do ar ou mudar de endereço, o site degrada em silêncio para a
      # fonte de reserva; aqui a falha aparece.
      - name: CDN da fonte Rawline responde
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 https://cdngovbr-ds.estaleiro.serpro.gov.br/design-system/fonts/rawline/css/rawline.css
