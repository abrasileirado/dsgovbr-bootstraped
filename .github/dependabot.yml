# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode
    # ser malicioso ou instável). Alertas de segurança ignoram o cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Espera 7 dias antes de propor uma versão recém-publicada (pacote novo pode
    # ser malicioso ou instável). Alertas de segurança ignoram o cooldown.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Não usamos "gitsubmodule": os submodules em vendor/ são fixados
  # deliberadamente em tags específicas (DP-01/DP-03 em docs/requisitos.md),
  # não na "latest". O Dependabot rastreia o commit mais recente do submodule
  # (não tags semânticas), o que já causou um bump indevido além da tag
  # pinada (PR #12). Avançar a tag é decisão manual, por issue; o aviso de
  # versão nova vem de .github/workflows/upstream-check.yml (DP-09).
